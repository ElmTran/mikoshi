<!doctype html>
<html lang="zh-CN">
<head>

<link rel="stylesheet" href="mock.css">
<link rel="stylesheet" href="style-a.css">

<body data-theme="light">

    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.8h5V7M6.5 7l.9 12.2h9.2L17.5 7M10.2 10.5v5.5M13.8 10.5v5.5"/></symbol>

<header class="chrome">
  <div class="c-name">Mikoshi 界面风格样稿</div>
  <div class="c-group" role="tablist" aria-label="风格">
    <button data-style-btn="a">A 原生</button>
    <button data-style-btn="b">B 键帽</button>
    <button data-style-btn="c">C 蓝染</button>
  </div>
  <div class="c-group" role="tablist" aria-label="页面">
    <button data-view-btn="main">主窗口</button>
    <button data-view-btn="quick">快速搜索</button>
    <button data-view-btn="unlock">解锁</button>
  </div>
  <button class="c-theme" data-theme-btn>深色</button>
</header>
<p class="c-desc" id="desc"></p>

<main class="stage">
  <div class="frame" id="frame">
    <div class="mock" id="mock"><div class="screen" id="screen"></div><div class="toast" id="toast" role="status" aria-live="polite"></div></div>
  </div>
</main>

<p class="c-tip">可以直接点、用方向键选条目，也可以按快捷键：Ctrl+B / Ctrl+C / Ctrl+T 复制，Ctrl+H 显示密码，Ctrl+F 搜索，Ctrl+L 锁定。浏览器自己占用了 Ctrl+T，这一项请点按钮试。</p>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
