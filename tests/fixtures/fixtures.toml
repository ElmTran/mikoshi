# Mikoshi KDBX test fixtures.
#
# TEST DATA ONLY: every password and key file in this directory is public.
# Never put a real database here.
#
# made_by:   who wrote the file (the reader under test must cope with it)
# password:  whether the file uses the shared test password below
# keyfile:   key file path, relative to this directory
# format / cipher / kdf: what the header must say; checked on every run
# optional:  made by hand in a GUI; skipped with a note while missing
#
# Run everything with:  cargo run -p kdbx-compat --release

