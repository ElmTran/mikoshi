[package]
name = "mikoshi"
version = "0.1.0"
description = "Mikoshi: a keyboard-first KeePass password manager for Windows"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "mikoshi_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mikoshi-core = { path = "../crates/mikoshi-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
url = "2"
zeroize.workspace = true
# Win32 for the clipboard formats and auto-lock; the version Tauri already uses
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_Ime",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
log = "0.4"
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
windows-version = "0.1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"

# Putting a hidden window's WebView to sleep (windows::set_awake). The same
# versions wry uses, so the COM types match the controller Tauri hands out.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
