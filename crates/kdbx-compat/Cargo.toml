[package]
name = "kdbx-compat"
version = "0.1.0"
description = "Developer tool: checks that the kdbx crate reads and round-trips KDBX files like KeePassXC, without data loss"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
kdbx = { path = "../kdbx" }
mikoshi-core = { path = "../mikoshi-core" }
serde = { version = "1", features = ["derive"] }
toml = "1"
roxmltree = "0.21"
base64 = "0.23"
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["std"] }
rpassword = "7"

# Minimal KDBX 4 writer (src/writer.rs) for files keepassxc-cli cannot make.
# Same versions the kdbx crate uses, so nothing is built twice.
hmac = "0.13"
aes = "0.9"
cbc = "0.2"
cipher = { version = "0.5", features = ["block-padding", "alloc"] }
chacha20 = "0.10"
flate2 = "1"
getrandom = "0.4"
