[package]
name = "kdbx"
version = "0.1.0"
description = "Lossless KDBX 3.1 / 4.x reader and KDBX 4.1 writer: edits the XML in place and writes everything else back untouched"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
zeroize.workspace = true
roxmltree = "0.21"
base64 = "0.23"
flate2 = "1"
getrandom = "0.4"
# RustCrypto primitives; the algorithms are never implemented here
sha2 = "0.11"
hmac = "0.13"
cipher = { version = "0.5", features = ["block-padding", "alloc"] }
aes = "0.9"
twofish = "0.8"
cbc = "0.2"
chacha20 = "0.10"
salsa20 = "0.11"
argon2 = { version = "0.6", default-features = false, features = ["alloc", "parallel"] }
