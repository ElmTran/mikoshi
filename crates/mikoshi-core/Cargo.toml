[package]
name = "mikoshi-core"
version = "0.1.0"
description = "KDBX access and domain logic for Mikoshi, independent of the UI shell"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
keepass.workspace = true
serde.workspace = true
zeroize.workspace = true
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std"] }
# TOTP. The versions keepass-rs already pulls in (through totp-lite).
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
percent-encoding = "2"

[dev-dependencies]
serde_json.workspace = true
