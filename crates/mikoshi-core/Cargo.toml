[package]
name = "mikoshi-core"
version = "0.1.0"
description = "KDBX access and domain logic for Mikoshi, independent of the UI shell"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
kdbx = { path = "../kdbx" }
serde.workspace = true
zeroize.workspace = true
base64 = "0.23"
# TOTP. The same versions the kdbx crate uses.
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
percent-encoding = "2"
# window associations written as //regex// (the version already in the tree)
regex = { version = "1", default-features = false, features = ["std", "unicode"] }

[dev-dependencies]
serde_json.workspace = true
