[package]
name = "mikoshi-core"
version = "0.1.0"
description = "KDBX access and domain logic for Mikoshi, independent of the UI shell"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
kdbx = { path = "../kdbx" }
serde.workspace = true
zeroize.workspace = true
base64 = "0.23"
# TOTP. The same versions the kdbx crate uses.
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
percent-encoding = "2"
# Internationalised domain names: "中文.com" and "xn--fiq228c.com" are one
# host. The version url already uses.
idna = "1"
# Password generator: the OS random source, and strength estimates (Dropbox's
# zxcvbn, run here so its dictionaries never go into the frontend)
getrandom = "0.4"
zxcvbn = "3"
# window associations written as //regex// (the version already in the tree)
regex = { version = "1", default-features = false, features = ["std", "unicode"] }

[dev-dependencies]
serde_json.workspace = true

# Saving: ReplaceFileW swaps the new file in and keeps the old one's attributes
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
