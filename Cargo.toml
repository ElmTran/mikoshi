[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
edition = "2024"
license = "MIT"
# Tauri 2.12 needs 1.90. Cargo prefers dependency versions that support this
# Rust version, so a value that is too low silently holds dependencies back.
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["zeroize_derive"] }

# Argon2 and the ciphers are unbearably slow without optimization, so
# dependencies are always built optimized, even in dev/test builds.
[profile.dev.package."*"]
opt-level = 3

[profile.test.package."*"]
opt-level = 3

# The KDF loops and ciphers are instantiated inside the kdbx crate itself, so
# it needs the same treatment as the dependencies.
[profile.dev.package.kdbx]
opt-level = 3

[profile.test.package.kdbx]
opt-level = 3

[profile.release]
# Opening a file is wrapped in catch_unwind as a last line of defence (a
# damaged file must never take the app down), which needs unwinding. Never
# switch to "abort".
panic = "unwind"
